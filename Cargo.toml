[workspace]
members = ["cli", "domain", "container", "infrastructure", "api/*"]
default-members = ["cli"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
env_logger = "0.10"
log = "0.4"
axum = "0.7"
tonic = "0.10"
prost = "0.12"
tonic-build = "0.10"
tower = { version = "0.4", features = ["util"] }

my_service_domain = { path = "domain" }
my_service_container = { path = "container" }
my_service_infrastructure = { path = "infrastructure" }
my_service_api_http = { path = "api/http" }
my_service_api_grpc = { path = "api/grpc" }
